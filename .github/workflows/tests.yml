name: Tests

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Report every platform's result, rather than cancelling the others on
      # the first failure — the point of the matrix is spotting OS-specific
      # breakage, most often in the credential backend.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The tests read credentials through the platform's real secret store, so
      # Linux needs a Secret Service provider that a headless runner lacks.
      - name: Install Secret Service provider
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      # Provisioning and the tests share one D-Bus session: the MCP server under
      # test shells out to secret-tool itself, so it must inherit the same bus.
      - name: Provision credentials and run integration tests
        if: runner.os == 'Linux'
        run: dbus-run-session -- ./scripts/run-tests-linux.sh

      - name: Provision test credentials
        if: runner.os != 'Linux'
        run: npm run test:setup

      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
